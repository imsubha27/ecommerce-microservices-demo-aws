apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce
  namespace: argocd   

spec:
  project: default
  source:
    repoURL: https://github.com/imsubha27/ecommerce-microservices-demo-aws
    targetRevision: main
    path: kubernetes 

  destination:
    server: https://kubernetes.default.svc   
    namespace: ecommerce

  # Sync Policy: fully automated 
  syncPolicy:

    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # revert any manual kubectl changes

    syncOptions:
      - CreateNamespace=true   # creates ecommerce namespace if not exists