name: Build, Push & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'   # only triggers when src/ changes

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 412628362705.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  # ── Job 1: Detect which services changed ──────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need last 2 commits to compare

      - name: Detect which services have changed
        id: detect
        run: |
          # Get all files changed in this push
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          # Loop through every service and check if its src folder changed
          SERVICES=()

          for svc in adservice authservice cartservice checkoutservice \
                     currencyservice emailservice frontend orderservice \
                     paymentservice productcatalogservice recommendationservice \
                     shippingservice shoppingassistantservice; do

            if echo "$CHANGED" | grep -q "^src/$svc/"; then
              echo "✓ $svc changed"
              SERVICES+=("$svc")
            fi
          done

          # If nothing changed, stop the workflow here
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No service changes detected. Nothing to build."
            echo 'matrix={"service":[]}' >> $GITHUB_OUTPUT
            echo 'has_changes=false' >> $GITHUB_OUTPUT
          else
            # Convert bash array to JSON array for the matrix
            JSON=$(printf '"%s",' "${SERVICES[@]}" | sed 's/,$//')
            echo "matrix={\"service\":[$JSON]}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Services to build: $JSON"
          fi


  # ── Job 2: Build, push, update deploy.yml ─────────────────────
  # This job runs once per changed service, all in parallel
  build-and-deploy:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false   # if one service fails, others still continue

    steps:

      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to read git tags

      # ── 2. Generate version number ──────────────────────────
      - name: Generate version number
        id: version
        run: |
          SVC=${{ matrix.service }}

          # Find latest tag for this service
          LATEST=$(git tag --list "$SVC-v*" --sort=-version:refname | head -1)

          if [ -z "$LATEST" ]; then
            # First time building this service
            NUMBER=1
          else
            # Extract number and increment e.g. frontend-v3 → 4
            NUMBER=$(echo $LATEST | sed "s/$SVC-v//")
            NUMBER=$((NUMBER + 1))
          fi

          # Format: v2-a1b2c3d4  (version number + short commit sha)
          SHORT_SHA=${GITHUB_SHA::8}
          VERSION="v${NUMBER}-${SHORT_SHA}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ── 3. AWS credentials ──────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 4. Login to ECR ─────────────────────────────────────
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── 5. Set Dockerfile path ──────────────────────────────
      # cartservice is a special case — Dockerfile is one level deeper
      - name: Set Dockerfile context path
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            echo "path=src/cartservice/src" >> $GITHUB_OUTPUT
          else
            echo "path=src/${{ matrix.service }}" >> $GITHUB_OUTPUT
          fi

      # ── 6. Build Docker image ────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/ecommerce/${{ matrix.service }}:${{ steps.version.outputs.version }} \
            ${{ steps.ctx.outputs.path }}

      # ── 7. Push to ECR ───────────────────────────────────────
      - name: Push image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/ecommerce/${{ matrix.service }}:${{ steps.version.outputs.version }}

      # ── 8. Update image tag in deploy.yml ───────────────────
      # ArgoCD watches this file, when it changes in Git,
      # ArgoCD auto syncs and rolls out the new image to the cluster
      - name: Update image tag in deploy.yml
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/ecommerce/${{ matrix.service }}
          VERSION=${{ steps.version.outputs.version }}
          DEPLOY=kubernetes/${{ matrix.service }}/deploy.yml

          # Replace existing tag (whatever it is) with the new version
          sed -i "s|$IMAGE:.*|$IMAGE:$VERSION|g" $DEPLOY

          echo "Updated $DEPLOY:"
          grep "image:" $DEPLOY

      # ── 9. Commit and push updated deploy.yml ───────────────
      - name: Commit updated deploy.yml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add kubernetes/${{ matrix.service }}/deploy.yml

          # Skip commit if nothing actually changed
          git diff --staged --quiet \
            && echo "No change in deploy.yml, skipping" \
            && exit 0

          git commit -m "deploy ${{ matrix.service }}:${{ steps.version.outputs.version }}"
          git push

      # ── 10. Create Git tag for this version ─────────────────
      - name: Create Git tag
        run: |
          git tag ${{ matrix.service }}-${{ steps.version.outputs.version }}
          git push origin ${{ matrix.service }}-${{ steps.version.outputs.version }}