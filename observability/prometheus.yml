global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth:8081']
    metrics_path: '/metrics'

  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:8080']
    metrics_path: '/_healthz'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']