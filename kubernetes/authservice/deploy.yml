apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
      app.kubernetes.io/instance: ecommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/instance: ecommerce
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: ecommerce-sa
      containers:
      - name: auth
        image: 412628362705.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/authservice:latest
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AUTH_PORT
        - name: AUTH_DB_HOST
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: host
        - name: AUTH_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AUTH_DB_PORT
        - name: AUTH_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AUTH_DB_NAME
        - name: AUTH_DB_USER
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: username
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
              
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 300m
            memory: 400Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8081