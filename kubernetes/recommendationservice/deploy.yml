apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation
      app.kubernetes.io/instance: ecommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation
        app.kubernetes.io/instance: ecommerce
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: ecommerce-sa
      containers:
      - name: recommendation
        image: 412628362705.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/recommendationservice:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: RECOMMENDATION_PORT
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: PRODUCT_CATALOG_SERVICE_ADDR

        resources:
          requests:
            cpu: 300m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10