apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: ecommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: ecommerce
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/part-of: ecommerce
    spec:
      containers:
      - name: frontend
        image: 412628362705.dkr.ecr.ap-south-1.amazonaws.com/ecommerce/frontend:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: FRONTEND_PORT
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: PRODUCT_CATALOG_SERVICE_ADDR
        - name: CART_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: CART_SERVICE_ADDR
        - name: CURRENCY_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: CURRENCY_SERVICE_ADDR
        - name: SHIPPING_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: SHIPPING_SERVICE_ADDR
        - name: RECOMMENDATION_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: RECOMMENDATION_SERVICE_ADDR
        - name: CHECKOUT_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: CHECKOUT_SERVICE_ADDR
        - name: AD_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AD_SERVICE_ADDR
        - name: SHOPPING_ASSISTANT_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: SHOPPING_ASSISTANT_SERVICE_ADDR
        - name: AUTH_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: AUTH_SERVICE_ADDR
        - name: ORDER_SERVICE_ADDR
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: ORDER_SERVICE_ADDR
        - name: ENABLE_ASSISTANT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: ENABLE_ASSISTANT
        - name: ENABLE_PROFILER
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: ENABLE_PROFILER
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 300m
            memory: 200Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          