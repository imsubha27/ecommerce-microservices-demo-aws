apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis          
    app.kubernetes.io/instance: ecommerce  
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP