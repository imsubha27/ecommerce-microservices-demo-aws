apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: shipping
    app.kubernetes.io/instance: ecommerce
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping
      app.kubernetes.io/instance: ecommerce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping
        app.kubernetes.io/instance: ecommerce
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/part-of: ecommerce
    spec:
      serviceAccountName: ecommerce-sa
      containers:
      - name: shipping
        image: 412628362705.dkr.ecr.us-east-1.amazonaws.com/ecommerce/shippingservice:latest
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: SHIPPING_PORT

      resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      readinessProbe:
        tcpSocket:
          port: 50051
        initialDelaySeconds: 10
        periodSeconds: 10