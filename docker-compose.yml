# Docker Compose file for microservices-demo-customise-aws

networks:
  default:
    name: microservices-demo
    driver: bridge


services:

  # AdService
  ad:
    image: ${IMAGE_NAME}/adservice:${IMAGE_VERSION}
    build:
      context: ./src/adservice
    deploy:
      resources:
        limits:
          memory: 400M
    restart: unless-stopped
    ports:
      - "${AD_PORT}"
    environment:
      - PORT=${AD_PORT}

  # Auth Service
  auth:
    image: ${IMAGE_NAME}/authservice:${IMAGE_VERSION}
    build:
      context: ./src/authservice
    restart: unless-stopped
    ports:
      - "${AUTH_PORT}"
    environment:
      - PORT=${AUTH_PORT}
      - AUTH_DB_HOST=${DB_HOST}
      - AUTH_DB_PORT=${DB_PORT}
      - AUTH_DB_NAME=${DB_NAME}
      - AUTH_DB_USER=${DB_USER}
      - AUTH_DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      auth-db:
        # Wait for Postgres to be actually ready, not just started.
        # This requires the healthcheck defined on auth-db below.
        condition: service_healthy

  # Cart service
  cart:
    image: ${IMAGE_NAME}/cartservice:${IMAGE_VERSION}
    build:
      context: ./src/cartservice/src
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${CART_PORT}"
    environment:
      - PORT=${CART_PORT}
      - REDIS_ADDR=redis:${REDIS_PORT}
    depends_on:
      redis:
        condition: service_started

  # Checkout service
  checkout:
    image: ${IMAGE_NAME}/checkoutservice:${IMAGE_VERSION}
    build:
      context: ./src/checkoutservice
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${CHECKOUT_PORT}"
    environment:
      - PRODUCT_CATALOG_SERVICE_ADDR=product-catalog:${PRODUCT_CATALOG_PORT}
      - CART_SERVICE_ADDR=cart:${CART_PORT}
      - CURRENCY_SERVICE_ADDR=currency:${CURRENCY_PORT}
      - PAYMENT_SERVICE_ADDR=payment:${PAYMENT_PORT}
      - SHIPPING_SERVICE_ADDR=shipping:${SHIPPING_PORT}
      - EMAIL_SERVICE_ADDR=email:${EMAIL_PORT}
   
    depends_on:
      cart:
        condition: service_started
      currency:
        condition: service_started
      email:
        condition: service_started
      payment:
        condition: service_started
      product-catalog:
        condition: service_started
      shipping:
        condition: service_started

  # Currency service
  currency:
    image: ${IMAGE_NAME}/currencyservice:${IMAGE_VERSION}
    build:
      context: ./src/currencyservice
    deploy:
      resources:
        limits:
          memory: 350M
    restart: unless-stopped
    ports:
      - "${CURRENCY_PORT}"
    environment:
      - PORT=${CURRENCY_PORT}

  # Email service
  email:
    image: ${IMAGE_NAME}/emailservice:${IMAGE_VERSION}
    build:
      context: ./src/emailservice
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped
    ports:
      - "${EMAIL_PORT}"
    environment:
      - PORT=${EMAIL_PORT}

  
  # Frontend
  frontend:
    image: ${IMAGE_NAME}/frontend:${IMAGE_VERSION}
    build:
      context: ./src/frontend
    deploy:
      resources:
        limits:
          memory: 150M
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}"
    environment:
      - PORT=${FRONTEND_PORT}
      - PRODUCT_CATALOG_SERVICE_ADDR=product-catalog:${PRODUCT_CATALOG_PORT}
      - CART_SERVICE_ADDR=cart:${CART_PORT}
      - CURRENCY_SERVICE_ADDR=currency:${CURRENCY_PORT}
      - SHIPPING_SERVICE_ADDR=shipping:${SHIPPING_PORT}
      - RECOMMENDATION_SERVICE_ADDR=recommendation:${RECOMMENDATION_PORT}
      - CHECKOUT_SERVICE_ADDR=checkout:${CHECKOUT_PORT}
      - AD_SERVICE_ADDR=ad:${AD_PORT}
      - ENABLE_ASSISTANT=true
      - SHOPPING_ASSISTANT_SERVICE_ADDR=shoppingassistant:${SHOPPING_ASSISTANT_PORT}
      - AUTH_SERVICE_ADDR=auth:${AUTH_PORT}
      - ORDER_SERVICE_ADDR=order:${ORDER_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - ENABLE_PROFILER=0
    depends_on:
      ad:
        condition: service_started
      auth:
        condition: service_started
      cart:
        condition: service_started
      checkout:
        condition: service_started
      currency:
        condition: service_started
      product-catalog:
        condition: service_started
      recommendation:
        condition: service_started
      shipping:
        condition: service_started
      order:
        condition: service_started
      shoppingassistant:
        condition: service_started  

  # Payment service
  payment:
    image: ${IMAGE_NAME}/paymentservice:${IMAGE_VERSION}
    build:
      context: ./src/paymentservice
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    ports:
      - "${PAYMENT_PORT}"
    environment:
      - PORT=${PAYMENT_PORT}


  # Product Catalog service
  product-catalog:
    image: ${IMAGE_NAME}/productcatalogservice:${IMAGE_VERSION}
    build:
      context: ./src/productcatalogservice
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${PRODUCT_CATALOG_PORT}"
    environment:
      - PORT=${PRODUCT_CATALOG_PORT}
    volumes:
      - ./src/productcatalogservice/products.json:/app/products.json


  # Recommendation service
  recommendation:
    image: ${IMAGE_NAME}/recommendation-service:${IMAGE_VERSION}
    build:
      context: ./src/recommendationservice
    deploy:
      resources:
        limits:
          memory: 300M 
    restart: unless-stopped
    ports:
      - "${RECOMMENDATION_PORT}"
    environment:
      - PORT=${RECOMMENDATION_PORT}
      - PRODUCT_CATALOG_SERVICE_ADDR=product-catalog:${PRODUCT_CATALOG_PORT}
    depends_on:
      product-catalog:
        condition: service_started


  # Shipping service
  shipping:
    image: ${IMAGE_NAME}/shippingservice:${IMAGE_VERSION}
    build:
      context: ./src/shippingservice
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${SHIPPING_PORT}"
    environment:
      - PORT=${SHIPPING_PORT}


  # Order Service
  order:
    image: ${IMAGE_NAME}/orderservice:${IMAGE_VERSION}
    build:
      context: ./src/orderservice
    restart: unless-stopped
    ports:
      - "${ORDER_PORT}"
    environment:
      - PORT=${ORDER_PORT}
      - ORDER_DB_HOST=order-db
      - ORDER_DB_PORT=${ORDER_DB_PORT}
      - ORDER_DB_NAME=${ORDER_DB_NAME}
      - ORDER_DB_USER=${ORDER_DB_USER}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      order-db:
        condition: service_started


  # Shopping Assistant Service
  shoppingassistant:
    image: ${IMAGE_NAME}/shoppingassistantservice:${IMAGE_VERSION}
    build:
      context: ./src     # Use the whole src as context since we need both the Dockerfile and products.json
      dockerfile: shoppingassistantservice/Dockerfile # point explicitly to Dockerfile
    restart: unless-stopped
    ports:
      - "${SHOPPING_ASSISTANT_PORT}"
    environment:
      - PORT=${SHOPPING_ASSISTANT_PORT}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql+psycopg://postgres:vectorpass@vector-db:5432/vectordb
      - COLLECTION_NAME=products
    depends_on:
      vector-db:
        condition: service_healthy


  # Vector DB for shopping assistant (pgvector)
  vector-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vectordb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=vectorpass
    ports:
      - "5433:5432"          # exposed on 5433 to avoid clash with auth-db
    volumes:
      - vector-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

 
  # Order DB (PostgreSQL)
  order-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${ORDER_DB_NAME}
      - POSTGRES_USER=${ORDER_DB_USER}
      - POSTGRES_PASSWORD=${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
  

  # Dependent Services
  # REDIS service
  redis:
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}"

  # Auth DB (PostgreSQL)
  # SECURITY: No host port is published. Services on the same Docker network
  # reach Postgres via hostname auth-db:5432 without any external exposure.
  # If you need local access for debugging, use:
  #   ports: ["127.0.0.1:5432:5432"]
  # Never publish 0.0.0.0:5432 on a cloud VM.
  auth-db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # No ports: block — database is intentionally not accessible from outside
    # the Docker network.
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ── Observability ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Set GRAFANA_PASSWORD in your .env file — never commit real passwords.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  auth-db-data:
  order-db-data:
  vector-db-data:
  grafana-data: