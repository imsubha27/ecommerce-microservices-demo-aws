{{ define "profile" }}
{{- template "header" . }}

<main>
  <div class="container" style="max-width:600px; padding: 2.5rem 1rem;">

    <h3 style="font-family:'DM Sans',sans-serif; font-weight:700; color:#1a0a0a; margin-bottom:1.5rem;">
      My Profile
    </h3>

    <div style="background:#fff; border:1px solid #e8e8e8; border-radius:10px; padding:2rem;">

      <!-- Avatar + name -->
      <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; padding-bottom:1.5rem; border-bottom:1px solid #f0f0f0;">
        <div style="width:56px; height:56px; border-radius:50%; background:#fce4ec; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#ad1457; flex-shrink:0; text-transform:uppercase;">
          {{ if $.username }}{{ slice $.username 0 1 }}{{ else }}?{{ end }}
        </div>
        <div>
          <div style="font-size:1rem; font-weight:700; color:#1a0a0a;">{{ $.username }}</div>
          <div style="font-size:0.82rem; color:#888; margin-top:2px;">Online Boutique Member</div>
        </div>
      </div>

      <!-- Fields -->
      <div style="display:grid; gap:1rem;">

        <div>
          <label style="font-size:0.75rem; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px;">Username</label>
          <div style="font-size:0.9rem; color:#333; padding:8px 12px; background:#fafafa; border:1px solid #eee; border-radius:6px;">{{ $.username }}</div>
        </div>

        <div>
          <label style="font-size:0.75rem; font-weight:700; color:#999; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px;">Preferred Currency</label>
          <div style="font-size:0.9rem; color:#333; padding:8px 12px; background:#fafafa; border:1px solid #eee; border-radius:6px;">{{ $.user_currency }}</div>
        </div>

      </div>

      <!-- Actions -->
      <div style="display:flex; gap:10px; margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid #f0f0f0;">
        <a href="{{ $.baseUrl }}/orders"
           style="font-size:0.85rem; padding:8px 20px; border-radius:20px; border:1px solid #ad1457; color:#ad1457; text-decoration:none; transition:background 0.2s, color 0.2s;"
           onmouseover="this.style.background='#ad1457';this.style.color='#fff'"
           onmouseout="this.style.background='transparent';this.style.color='#ad1457'">
          View My Orders
        </a>
        <a href="{{ $.baseUrl }}/logout"
           style="font-size:0.85rem; padding:8px 20px; border-radius:20px; border:1px solid #ccc; color:#555; text-decoration:none; transition:background 0.2s, color 0.2s;"
           onmouseover="this.style.background='#f44336';this.style.borderColor='#f44336';this.style.color='#fff'"
           onmouseout="this.style.background='transparent';this.style.borderColor='#ccc';this.style.color='#555'">
          Logout
        </a>
      </div>

    </div>
  </div>
</main>

{{- template "footer" . }}
{{ end }}
