{{ define "login" }}

{{ template "header" . }}

<div {{ with $.platform_css }} class="{{.}}" {{ end }}>
  <span class="platform-flag">
    {{$.platform_name}}
  </span>
</div>

<main role="main" class="home">

  <div class="home-mobile-hero-banner d-lg-none"></div>

  <div class="container-fluid">
    <div class="row">

      <div class="col-12 col-lg-12 px-10-percent">

        <div class="row justify-content-center px-xl-6">

          <div class="col-md-4">

            <div class="auth-card">

              <div class="auth-card-logo">
                <div class="logo-icon">
                  <i class="bi bi-bag-heart-fill"></i>
                </div>
                <h2>Welcome back</h2>
                <p class="subtitle">Sign in to your account</p>
              </div>

              {{ if $.error }}
              <div class="alert alert-danger alert-auth">
                {{ $.error }}
              </div>
              {{ end }}

              <form method="POST" action="{{ $.baseUrl }}/login">

                <div class="form-group">
                  <label>Email</label>
                  <input type="email" name="email" class="form-control"
                         value="{{ $.username }}" required>
                </div>

                <div class="form-group">
                  <label>Password</label>
                  <input type="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-auth">
                  Sign In
                </button>

              </form>

              <div class="auth-switch">
                Don't have an account?
                <a href="{{ $.baseUrl }}/register">Register</a>
              </div>

            </div>

          </div>

        </div>

        <!-- Desktop Footer -->
        <div class="row d-none d-lg-block home-desktop-footer-row">
          <div class="col-12 p-0">
            {{ template "footer" . }}
          </div>
        </div>

      </div>

    </div>
  </div>

</main>

<!-- Mobile Footer -->
<div class="d-lg-none">
  {{ template "footer" . }}
</div>

{{ end }}
